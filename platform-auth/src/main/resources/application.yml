spring:
  application:
    name: platform-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  config:
    import:
      - classpath:platform-observability.yml
      - nacos:application.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
      - nacos:${spring.application.name}.yml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}

ai:
  security:
    super-admin:
      enabled: ${PLATFORM_SUPER_ADMIN_ENABLED:false}
      username: ${PLATFORM_SUPER_ADMIN_USERNAME:}
      # 值必须为标准裸 BCrypt(SHA-1(UTF-8 原始密码))；不得添加自定义存储前缀。
      password-hash: ${PLATFORM_SUPER_ADMIN_PASSWORD_HASH:}
