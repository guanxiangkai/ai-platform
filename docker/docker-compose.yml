x-common-env: &common-env
  TZ: Asia/Shanghai
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: prod
  NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:?NACOS_SERVER_ADDR is required}
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:?NACOS_NAMESPACE is required}
  NACOS_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
  NACOS_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
  NACOS_DISCOVERY_GROUP: ${NACOS_DISCOVERY_GROUP:?NACOS_DISCOVERY_GROUP is required}
  NACOS_CONFIG_GROUP: ${NACOS_CONFIG_GROUP:?NACOS_CONFIG_GROUP is required}
  PLATFORM_DB_HOST: ${PLATFORM_DB_HOST:?PLATFORM_DB_HOST is required}
  PLATFORM_DB_PORT: ${PLATFORM_DB_PORT:?PLATFORM_DB_PORT is required}
  PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:?PLATFORM_DB_NAME is required}
  PLATFORM_DB_SCHEMA: ${PLATFORM_DB_SCHEMA:?PLATFORM_DB_SCHEMA is required}
  PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:?PLATFORM_DB_USERNAME is required}
  PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is required}
  PLATFORM_ENCRYPT_KEY: ${PLATFORM_ENCRYPT_KEY:?PLATFORM_ENCRYPT_KEY is required}
  REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
  REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  TRUSTED_FORWARD_TOKEN: ${TRUSTED_FORWARD_TOKEN:?TRUSTED_FORWARD_TOKEN is required}
  JWT_KEY_ID: ${JWT_KEY_ID:-ai-default-key}
  JWT_ISSUER: ${JWT_ISSUER:-ai-platform}
  JWT_ACCESS_TOKEN_AUDIENCE: ${JWT_ACCESS_TOKEN_AUDIENCE:-ai-platform-gateway}
  JWT_ALLOWED_CLOCK_SKEW: ${JWT_ALLOWED_CLOCK_SKEW:-60s}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [platform-network]
  tmpfs:
    - /app/.runtime:rw,nosuid,nodev,noexec,size=128m,uid=10001,gid=10001,mode=0750
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "2"}

services:
  powerjob-server:
    image: ${POWERJOB_SERVER_IMAGE:?POWERJOB_SERVER_IMAGE is required}
    container_name: powerjob-server
    restart: unless-stopped
    environment:
      JVMOPTIONS: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m"
      # 使用 Spring Boot 环境变量绑定，避免数据库与管理员凭据出现在 Java 进程命令行。
      SPRING_PROFILES_ACTIVE: product
      SPRING_DATASOURCE_CORE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_CORE_JDBC_URL: jdbc:postgresql://${POWERJOB_DB_HOST:?POWERJOB_DB_HOST is required}:${POWERJOB_DB_PORT:?POWERJOB_DB_PORT is required}/${POWERJOB_DB_NAME:?POWERJOB_DB_NAME is required}
      SPRING_DATASOURCE_CORE_USERNAME: ${POWERJOB_DB_USERNAME:?POWERJOB_DB_USERNAME is required}
      SPRING_DATASOURCE_CORE_PASSWORD: ${POWERJOB_DB_PASSWORD:?POWERJOB_DB_PASSWORD is required}
      SPRING_DATASOURCE_CORE_MAXIMUM_POOL_SIZE: "10"
      SPRING_DATASOURCE_CORE_MINIMUM_IDLE: "2"
      SPRING_DATASOURCE_REMOTE_HIBERNATE_PROPERTIES_HIBERNATE_DIALECT: tech.powerjob.server.persistence.config.dialect.PowerJobPGDialect
      # initiliaze 是 PowerJob 5.x 上游属性的既有拼写，不能在此自行更正。
      OMS_AUTH_INITILIAZE_ADMIN_PASSWORD: ${POWERJOB_ADMIN_PASSWORD:?POWERJOB_ADMIN_PASSWORD is required}
      OMS_AUTH_OPENAPI_ENABLE: "true"
      OMS_INSTANCEINFO_RETENTION: "7"
      OMS_CONTAINER_RETENTION_LOCAL: "7"
      OMS_CONTAINER_RETENTION_REMOTE: "-1"
    volumes:
      - powerjob-data:/root/powerjob/server
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    # 不发布宿主机端口；上游修复 CVE-2025-14518 前还必须在部署侧阻断
    # /server/checkConnectivity，并把该网络限制为受信服务可加入。
    networks: [platform-network]

  platform-agent:
    <<: *service-defaults
    image: ai-platform-agent:current
    container_name: platform-agent
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-modules/platform-agent/build/libs/platform-agent-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-agent}}
    environment:
      <<: *common-env
      PLATFORM_REDIS_DATABASE: ${PLATFORM_REDIS_DATABASE:?PLATFORM_REDIS_DATABASE is required}
      AGENT_ASR_API_KEY: ${AGENT_ASR_API_KEY:-}
    mem_limit: 1g

  platform-system:
    <<: *service-defaults
    image: ai-platform-system:current
    container_name: platform-system
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-modules/platform-system/build/libs/platform-system-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-system}}
    environment: *common-env
    mem_limit: 1500m

  platform-files:
    <<: *service-defaults
    image: ai-platform-files:current
    container_name: platform-files
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-modules/platform-files/build/libs/platform-files-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-files}}
    environment:
      <<: *common-env
      OSS_ENDPOINT: ${OSS_ENDPOINT:?OSS_ENDPOINT is required}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:?OSS_ACCESS_KEY is required}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:?OSS_SECRET_KEY is required}
      OSS_BUCKET: ${OSS_BUCKET:?OSS_BUCKET is required}
      OSS_REGION: ${OSS_REGION:?OSS_REGION is required}
    mem_limit: 1g

  platform-sse:
    <<: *service-defaults
    image: ai-platform-sse:current
    container_name: platform-sse
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-modules/platform-sse/build/libs/platform-sse-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-sse}}
    environment: *common-env
    mem_limit: 1g

  platform-scheduler:
    <<: *service-defaults
    image: ai-platform-scheduler:current
    container_name: platform-scheduler
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-modules/platform-scheduler/build/libs/platform-scheduler-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-scheduler}}
    environment:
      <<: *common-env
      POWERJOB_SERVER_ADDRESSES: ${POWERJOB_SERVER_ADDRESSES:?POWERJOB_SERVER_ADDRESSES is required}
    depends_on:
      powerjob-server:
        condition: service_healthy
    mem_limit: 1g

  platform-auth:
    <<: *service-defaults
    image: ai-platform-auth:current
    container_name: platform-auth
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-auth/build/libs/platform-auth-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-auth}}
    environment:
      <<: *common-env
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_REFRESH_TOKEN_AUDIENCE: ${JWT_REFRESH_TOKEN_AUDIENCE:-ai-platform-auth}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-2h}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-7d}
      PLATFORM_SUPER_ADMIN_ENABLED: ${PLATFORM_SUPER_ADMIN_ENABLED:-false}
      PLATFORM_SUPER_ADMIN_USERNAME: ${PLATFORM_SUPER_ADMIN_USERNAME:-}
      PLATFORM_SUPER_ADMIN_PASSWORD_HASH: ${PLATFORM_SUPER_ADMIN_PASSWORD_HASH:-}
    mem_limit: 1g

  platform-gateway:
    <<: *service-defaults
    image: ai-platform-gateway:current
    container_name: platform-gateway
    build: {context: .., dockerfile: docker/Dockerfile, pull: true, args: {RUNTIME_IMAGE: "${JAVA_RUNTIME_IMAGE:-container-registry.oracle.com/graalvm/jdk:25.0.4}", RUNTIME_SETUP_COMMAND: "${JAVA_RUNTIME_SETUP_COMMAND:-true}", JAR_FILE: platform-gateway/build/libs/platform-gateway-1.0.0-SNAPSHOT.jar, SERVICE_NAME: platform-gateway}}
    environment:
      <<: *common-env
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      # 前方存在受控代理时显式提供 Spring Cloud Gateway 可信代理正则；默认正则不匹配任何地址。
      GATEWAY_TRUSTED_PROXIES_REGEX: '${GATEWAY_TRUSTED_PROXIES_REGEX:-(?!)}'
    ports: ["${PLATFORM_GATEWAY_PORT:?PLATFORM_GATEWAY_PORT is required}:8080"]
    mem_limit: 1g

networks:
  platform-network: {external: true, name: "${PLATFORM_NETWORK:?PLATFORM_NETWORK is required}"}

volumes:
  powerjob-data:
