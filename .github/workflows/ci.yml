name: Java 质量门禁

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 执行 Gitleaks 扫描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: 构建与测试全部模块
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出平台源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 检出 AI Plus 当前主分支
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guanxiangkai/ai-plus
          ref: main
          path: .ci/ai-plus

      - name: 配置 JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: graalvm
          java-version: "25.0.4"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 验证平台与 AI Plus 当前源码
        env:
          AI_PLUS_HOME: ${{ github.workspace }}/.ci/ai-plus
        run: ./gradlew buildAll --no-daemon --stacktrace

      - name: 上传 platform-agent 可部署制品
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-agent-${{ github.sha }}
          path: platform-modules/platform-agent/build/libs/platform-agent-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
