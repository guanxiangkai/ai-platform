name: Java 质量门禁

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出完整历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 执行 Gitleaks 扫描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: 构建与测试全部模块
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出平台源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 检出已固定的 AI Plus 源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guanxiangkai/ai-plus
          ref: 965f6f6093276a5c3259a385f2c63d6a544f8c3c
          path: .ci/ai-plus

      - name: 配置 JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: graalvm
          java-version: "25.0.4"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 验证平台与 AI Plus 当前源码
        env:
          AI_PLUS_HOME: ${{ github.workspace }}/.ci/ai-plus
        run: ./gradlew buildAll --no-daemon --stacktrace

  verify-published:
    name: 验证 Maven Central 发布依赖
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出平台源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: graalvm
          java-version: "25.0.4"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: 直接使用发布制品构建和测试全部模块
        run: ./gradlew buildAll --no-daemon --stacktrace

      - name: 校验网关部署包的日志切面运行时依赖
        run: python3 scripts/verify-gateway-runtime.py platform-gateway/build/libs/platform-gateway-1.0.0-SNAPSHOT.jar

      - name: 上传 platform-auth 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-auth-${{ github.sha }}
          path: platform-auth/build/libs/platform-auth-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-gateway 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-gateway-${{ github.sha }}
          path: platform-gateway/build/libs/platform-gateway-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-system 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-system-${{ github.sha }}
          path: platform-modules/platform-system/build/libs/platform-system-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-files 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-files-${{ github.sha }}
          path: platform-modules/platform-files/build/libs/platform-files-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-sse 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-sse-${{ github.sha }}
          path: platform-modules/platform-sse/build/libs/platform-sse-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-agent 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-agent-${{ github.sha }}
          path: platform-modules/platform-agent/build/libs/platform-agent-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 上传 platform-scheduler 可部署制品
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-scheduler-${{ github.sha }}
          path: platform-modules/platform-scheduler/build/libs/platform-scheduler-1.0.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: 记录平台服务制品摘要
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          names = ['platform-auth', 'platform-gateway', 'platform-system', 'platform-files', 'platform-sse', 'platform-agent', 'platform-scheduler']
          jars = {}
          for name in names:
              directory = pathlib.Path(name) if name in ['platform-auth', 'platform-gateway'] else pathlib.Path('platform-modules') / name
              with (directory / 'build/libs' / (name + '-1.0.0-SNAPSHOT.jar')).open('rb') as source:
                  jars[name] = hashlib.file_digest(source, 'sha256').hexdigest()
          pathlib.Path('build/platform-service-manifest.json').write_text(json.dumps({'revision': os.environ['GITHUB_SHA'], 'jars': jars}, indent=2))
          PY

      - name: 上传平台服务制品摘要
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-service-manifest-${{ github.sha }}
          path: build/platform-service-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: 生成不可变平台 API Maven bundle
        run: >-
          ./gradlew
          :platform-api:platform-core-api:publishMavenJavaPublicationToApiBundleRepository
          :platform-api:platform-system-api:publishMavenJavaPublicationToApiBundleRepository
          :platform-api:platform-files-api:publishMavenJavaPublicationToApiBundleRepository
          :platform-api:platform-agent-api:publishMavenJavaPublicationToApiBundleRepository
          -Pversion=1.0.0-${GITHUB_SHA}
          --no-daemon --stacktrace

      - name: 校验平台 API Maven bundle
        run: >-
          sh scripts/verify-platform-api-maven-bundle.sh
          build/platform-api-maven-repository
          1.0.0-${GITHUB_SHA}

      - name: 上传平台 API Maven bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-api-maven-${{ github.sha }}
          path: build/platform-api-maven-repository
          if-no-files-found: error
          retention-days: 7
