name: 平台质量门禁

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建并测试共享平台
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 尝试检出同名 AI Plus 任务分支
        id: ai-plus-task-branch
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guanxiangkai/ai-plus
          ref: ${{ github.head_ref || github.ref_name }}
          path: .ci/ai-plus-task
          fetch-depth: 1
          persist-credentials: false

      - name: 回退到 AI Plus 开发基线源码
        if: steps.ai-plus-task-branch.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: guanxiangkai/ai-plus
          ref: dev
          path: .ci/ai-plus-dev
          fetch-depth: 1
          persist-credentials: false

      - name: 选择 AI Plus 联合构建源码
        shell: bash
        env:
          AI_PLUS_TASK_OUTCOME: ${{ steps.ai-plus-task-branch.outcome }}
        run: |
          if test "$AI_PLUS_TASK_OUTCOME" = "success"; then
            ai_plus_home="${GITHUB_WORKSPACE}/.ci/ai-plus-task"
          else
            ai_plus_home="${GITHUB_WORKSPACE}/.ci/ai-plus-dev"
          fi
          test -f "$ai_plus_home/settings.gradle.kts"
          echo "AI_PLUS_HOME=$ai_plus_home" >> "$GITHUB_ENV"

      - name: 配置 JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: graalvm
          java-version: "25.0.4"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: 执行完整质量门禁
        run: ./gradlew clean build --no-daemon --stacktrace
