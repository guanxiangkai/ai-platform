version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    target-branch: main
    commit-message:
      prefix: build
      include: scope
    groups:
      spring-platform:
        patterns:
          - "org.springframework*"
          - "com.alibaba.cloud*"
      ai-plus:
        patterns:
          - "io.github.guanxiangkai*"
      observability:
        patterns:
          - "io.micrometer*"
          - "io.opentelemetry*"
          - "io.projectreactor*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: main
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    target-branch: main
    commit-message:
      prefix: build
      include: scope
